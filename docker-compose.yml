name: reconhub

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: reconhub-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Local development only. Override with an .env file or shell variable.
      MSSQL_SA_PASSWORD: ${RECONHUB_SA_PASSWORD:-ReconHub_Dev_2026!}
    ports:
      - "1433:1433"
    volumes:
      - reconhub-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  reconhub-sqldata:
