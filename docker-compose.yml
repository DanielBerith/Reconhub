name: reconhub

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: reconhub-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Set in a .env file next to this file (copy .env.example). Never commit the real value.
      MSSQL_SA_PASSWORD: ${RECONHUB_SA_PASSWORD:?Set RECONHUB_SA_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:1433:1433" # loopback only: not reachable from the network
    volumes:
      - reconhub-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  reconhub-sqldata:
